name: Validate and deploy ClearDraft

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run static site tests
        run: python -m unittest discover --start-directory tests --verbose

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run AI feature tests
        run: node --test tests/ai_features.test.js

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check GitHub Pages configuration
        id: pages-check
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              core.setOutput("enabled", "true");
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              core.setOutput("enabled", "false");
              core.warning("GitHub Pages is not enabled. Deployment will be skipped; see the Actions summary for setup instructions.");
            }

      - name: Explain required Pages setup
        if: steps.pages-check.outputs.enabled == 'false'
        run: |
          {
            echo "## GitHub Pages deployment skipped"
            echo
            echo "The repository does not have a Pages site configured yet."
            echo
            echo "1. Open **Settings → Pages** in this repository."
            echo "2. Set **Build and deployment → Source** to **GitHub Actions**."
            echo "3. Re-run this workflow or push another commit to \`main\`."
            echo
            echo "> Review your repository plan and visibility before enabling Pages. A published Pages site is publicly accessible, even when its source repository is private."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure GitHub Pages
        if: steps.pages-check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload web app
        if: steps.pages-check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web

      - name: Deploy web app
        if: steps.pages-check.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
